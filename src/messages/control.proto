syntax = "proto3";

package openocean;

import "messages/options.proto";

message Speed
{
    optional double value = 30 [(openocean.field).units = "m/s"];

    enum SpeedMode
    {
        OVER_WATER = 1;
        OVER_GROUND = 2;
    }
    optional SpeedMode mode = 31 [default = OVER_WATER];
}

message Euler
{
    optional double roll = 20 [(openocean.field).units = "rad"];
    optional double pitch = 21 [(openocean.field).units = "rad"];
    // clockwise from true north
    optional double heading = 22 [(openocean.field).units = "rad"];
}

// Quantities, frames, and field numbers match Navigation.
message ControlSetpoint
{
    uint64 time = 1 [(openocean.field).units =
                         "microseconds since 1970-01-01 00:00:00 UTC"];

    optional double depth = 12 [(openocean.field).units = "m"];
    // above the seafloor
    optional double altitude = 13 [(openocean.field).units = "m"];

    optional Euler angle = 14;
    optional Speed speed = 30;

    message CustomSetpoint
    {
        string domain = 1;
        double value = 2 [(openocean.field).units_field = "units"];
        string units = 3;
    }
    repeated CustomSetpoint custom = 100;
}
