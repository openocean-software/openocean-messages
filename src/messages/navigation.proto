syntax = "proto3";

package openocean;

import "messages/options.proto";
import "messages/control.proto";

// Frames:
//  - geodetic: WGS-84 latitude, longitude, and depth (positive down)
//  - local: ENU x (east), y (north), z (up) relative to the datum, so z =
//  -depth
//  - body: x forward, y starboard, z down (Fossen / SNAME)
//
// Field numbers are grouped by quantity and shared with ControlSetpoint.
message Navigation
{
    uint64 time = 1 [(openocean.field).units =
                         "microseconds since 1970-01-01 00:00:00 UTC"];
    optional uint64 io_time = 2
        [(openocean.field).units =
             "microseconds since 1970-01-01 00:00:00 UTC"];
    string vehicle_name = 3;

    message Geodetic
    {
        optional double latitude = 1
            [(openocean.field).units = "degrees_north"];
        optional double longitude = 2
            [(openocean.field).units = "degrees_east"];
        optional double depth = 3 [(openocean.field).units = "m"];
    }

    message ENU
    {
        optional Geodetic datum = 1;
        optional double e = 2 [(openocean.field).units = "m"];
        optional double n = 3 [(openocean.field).units = "m"];
        optional double u = 4 [(openocean.field).units = "m"];
    }

    oneof position
    {
        Geodetic global = 10;
        ENU local = 11;
    }
    optional Euler angle = 12;

    message Velocity
    {
        optional double u = 1 [(openocean.field).units = "m/s"];
        optional double v = 2 [(openocean.field).units = "m/s"];
        optional double w = 3 [(openocean.field).units = "m/s"];
    }

    oneof linear_speed
    {
        Speed speed = 13;
        Velocities velocity = 14;
    }
    enum SpeedMode
    {
        SPEED_MODE_UNKNOWN = 0;
        SPEED_MODE_REF_GROUND = 1;
        SPEED_MODE_REF_WATER = 2;
        SPEED_MODE_ESTIMATE = 3;
    }
    SpeedMode speed_mode = 15;

    optional double altitude = 16 [(openocean.field).units = "m"];
    optional double course_over_ground = 17 [(openocean.field).units = "rad"];

    message EulerRates
    {
        optional double p = 1 [(openocean.field).units = "rad/s"];
        optional double q = 2 [(openocean.field).units = "rad/s"];
        optional double r = 3 [(openocean.field).units = "rad/s"];
    }
    optional EulerRates angle_rate = 18;

    message Accelerations
    {
        optional double du_dt = 1 [(openocean.field).units = "m/s^2"];
        optional double dv_dt = 2 [(openocean.field).units = "m/s^2"];
        optional double dw_dt = 3 [(openocean.field).units = "m/s^2"];
    }
    optional Accelerations accel = 19;

    message EulerAccel
    {
        optional double dp_dt = 1 [(openocean.field).units = "rad/s^2"];
        optional double dq_dt = 2 [(openocean.field).units = "rad/s^2"];
        optional double dr_dt = 3 [(openocean.field).units = "rad/s^2"];
    }
    optional EulerAccel angle_accel = 20;
}
