syntax = "proto3";

package openocean;

import "messages/options.proto";

// Frames:
//  - geodetic: WGS-84 latitude, longitude, and depth (positive down)
//  - local: ENU x (east), y (north), z (up) relative to the datum, so z = -depth
//  - body: x forward, y starboard, z down (Fossen / SNAME)
//
// Field numbers are grouped by quantity and shared with ControlSetpoint.
message Navigation
{
    uint64 time = 1 [(openocean.field).units =
                         "microseconds since 1970-01-01 00:00:00 UTC"];
    optional uint64 io_time = 2 [(openocean.field).units =
                                     "microseconds since 1970-01-01 00:00:00 UTC"];
    string vehicle_name = 3;

    optional double latitude = 10 [(openocean.field).units = "degrees_north"];
    optional double longitude = 11 [(openocean.field).units = "degrees_east"];
    optional double depth = 12 [(openocean.field).units = "m"];
    // above the seafloor
    optional double altitude = 13 [(openocean.field).units = "m"];

    optional double datum_latitude = 14 [(openocean.field).units = "degrees_north"];
    optional double datum_longitude = 15 [(openocean.field).units = "degrees_east"];
    optional double x = 16 [(openocean.field).units = "m"];
    optional double y = 17 [(openocean.field).units = "m"];
    optional double z = 18 [(openocean.field).units = "m"];

    optional double roll = 20 [(openocean.field).units = "rad"];
    optional double pitch = 21 [(openocean.field).units = "rad"];
    // clockwise from true north
    optional double heading = 22 [(openocean.field).units = "rad"];

    optional double speed_over_water = 30 [(openocean.field).units = "m/s"];
    optional double speed_over_ground = 31 [(openocean.field).units = "m/s"];
    // clockwise from true north
    optional double course_over_ground = 32 [(openocean.field).units = "rad"];
    optional double surge_u = 33 [(openocean.field).units = "m/s"];
    optional double sway_v = 34 [(openocean.field).units = "m/s"];
    optional double heave_w = 35 [(openocean.field).units = "m/s"];

    optional double roll_rate_p = 40 [(openocean.field).units = "rad/s"];
    optional double pitch_rate_q = 41 [(openocean.field).units = "rad/s"];
    optional double yaw_rate_r = 42 [(openocean.field).units = "rad/s"];

    optional double x_accel_du_dt = 50 [(openocean.field).units = "m/s^2"];
    optional double y_accel_dv_dt = 51 [(openocean.field).units = "m/s^2"];
    optional double z_accel_dw_dt = 52 [(openocean.field).units = "m/s^2"];
    optional double roll_accel_dp_dt = 53 [(openocean.field).units = "rad/s^2"];
    optional double pitch_accel_dq_dt = 54 [(openocean.field).units = "rad/s^2"];
    optional double yaw_accel_dr_dt = 55 [(openocean.field).units = "rad/s^2"];

    enum PositionMode
    {
        POSITION_MODE_NONE = 0;
        POSITION_MODE_GPS = 1;
        POSITION_MODE_POSITION_FIX = 2;
        POSITION_MODE_DEAD_RECKON = 3;
    }
    PositionMode position_mode = 60;

    enum VelocityMode
    {
        VELOCITY_MODE_NONE = 0;
        VELOCITY_MODE_REF_GROUND = 1;
        VELOCITY_MODE_REF_WATER = 2;
        VELOCITY_MODE_ESTIMATE = 3;
    }
    // reference for surge_u, sway_v, and heave_w
    VelocityMode velocity_mode = 61;
}
